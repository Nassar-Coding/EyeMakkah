name: Mobile auth build and QA

on:
  push:
    branches:
      - "claude/upbeat-bell-hkmvzy"
    paths-ignore:
      - "dist/**"
      - "release/**"

permissions:
  contents: write

env:
  CI: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: "claude/upbeat-bell-hkmvzy"
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax and import check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Entry flow QA — Arabic and English
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/entry"
          ROOT="$GITHUB_WORKSPACE/dist" OUT="$RUNNER_TEMP/entry" node scripts/entry-check.mjs

      - name: Core journey regression QA
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          ROOT="$GITHUB_WORKSPACE/dist" SHOT_DIR="$RUNNER_TEMP/shots" node scripts/verify.mjs

      - name: Rebuild zero-build Vercel package
        shell: bash
        run: |
          rm -rf release/EyeMakkah_Vercel_DragDrop
          mkdir -p release
          cp -R dist release/EyeMakkah_Vercel_DragDrop
          rm -f release/EyeMakkah_Vercel_DragDrop.zip
          cd release/EyeMakkah_Vercel_DragDrop
          zip -qr ../EyeMakkah_Vercel_DragDrop.zip .

      - name: Commit generated build and package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist release
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Build mobile auth Vercel package [skip ci]"
          git push origin HEAD:"claude/upbeat-bell-hkmvzy"
